# App on /. /api → backend. Any /w… → 301 to https://$host/… (absolute URL; avoids bad relative Location behind TLS proxies).
# api.ancap.cloud → FastAPI only (Swagger /docs, /openapi.json, /* must not hit Next.js).
#
# Use named upstream blocks (not variable proxy_pass). Variable-based proxy_pass + Docker
# DNS has been observed to mis-route /api/* onto the frontend container, which breaks login.
#
# conf.d is included inside http {} — limit_req_zone is valid here.

limit_req_zone $binary_remote_addr zone=acp_rpc:10m rate=5r/s;

upstream ancap_api {
    server api:8000;
}

upstream ancap_frontend {
    server frontend:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

map $http_x_forwarded_proto $ancap_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $uri $ancap_redir_no_w {
    ~*^/w/(.*)$ /$1;
    ~*^/w$ /;
    default "";
}

# Common security headers (inject via include in every location that sets add_header).
# Keep conservative: no CSP (risks breaking Next.js/Swagger); HSTS safe behind Cloudflare TLS.
# NOTE: nginx add_header only inherits when a location has NO add_header of its own,
# so we repeat this include in each location below.
# File-based includes are not used; keeping the list here for a single source of truth:
#   X-Frame-Options DENY
#   X-Content-Type-Options nosniff
#   Referrer-Policy strict-origin-when-cross-origin
#   Permissions-Policy "geolocation=(), microphone=(), camera=()"
#   Cross-Origin-Opener-Policy same-origin-allow-popups
#   Cross-Origin-Resource-Policy same-site
#   Strict-Transport-Security "max-age=31536000; includeSubDomains"

# Public API host: all paths go to uvicorn (not the Next frontend).
# CORP cross-origin: browser clients on ancap.cloud call this host with credentials.
# CORS itself is set by FastAPI; keep proxy timeouts above chain write budget.
server {
    listen 80;
    server_name api.ancap.cloud;

    location / {
        proxy_pass http://ancap_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }
}

# Public ACP RPC host: expose host ACP node over /rpc.
server {
    listen 80;
    server_name acp1.ancap.cloud;

    # Liveness for host/Cloudflare routing checks (does not touch the chain).
    location = /healthz {
        default_type application/json;
        add_header X-Ancap-Upstream acp-rpc always;
        return 200 '{"ok":true,"service":"acp-rpc"}';
    }

    location = /rpc {
        limit_req zone=acp_rpc burst=20 nodelay;
        proxy_pass http://acp-node:8545/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream acp-rpc always;
    }

    # Trailing slash clients (some wallets) → canonical /rpc.
    location = /rpc/ {
        return 308 /rpc;
    }

    location / {
        default_type application/json;
        add_header X-Ancap-Upstream acp-rpc always;
        return 404 '{"ok":false,"error":"not_found","hint":"POST JSON-RPC to /rpc"}';
    }
}

# Main site: Next.js + /api/* → backend with /api prefix stripped.
server {
    listen 80 default_server;
    server_name ancap.cloud www.ancap.cloud;

    # Swagger at /api/docs loads openapi from same browser origin as absolute /openapi.json.
    location = /openapi.json {
        proxy_pass http://ancap_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Cloudflare/tunnel sometimes strips /api before origin, so public /api/docs
    # arrives as /docs. Exact matches only — keep /docs/wacp etc. on Next.js.
    location = /docs {
        proxy_pass http://ancap_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    location = /docs/ {
        proxy_pass http://ancap_api/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    location = /redoc {
        proxy_pass http://ancap_api/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    location = /redoc/ {
        proxy_pass http://ancap_api/redoc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Trailing-slash form: /api/v1/... → http://ancap_api/v1/...
    location ^~ /api/ {
        proxy_pass http://ancap_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Exact /api → backend root (avoid falling through to Next homepage).
    location = /api {
        proxy_pass http://ancap_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Fallback public RPC path when Host is ancap.cloud (same upstream as acp1.ancap.cloud/rpc).
    location = /rpc {
        limit_req zone=acp_rpc burst=20 nodelay;
        proxy_pass http://acp-node:8545/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream acp-rpc always;
    }

    location = /rpc/ {
        return 308 /rpc;
    }

    # Some edges (Cloudflare/host proxies) strip the /api prefix before the
    # request reaches this container, so the public path arrives as /v1/*.
    # Route those directly to FastAPI instead of Next.js.
    location ^~ /v1/ {
        proxy_pass http://ancap_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Force canonical URL without /w (absolute https — critical behind Cloudflare / tunnel on :80).
    location = /w {
        return 301 https://$host$ancap_redir_no_w$is_args$args;
    }

    location ^~ /w/ {
        return 301 https://$host$ancap_redir_no_w$is_args$args;
    }

    # Public token artwork must be embeddable by explorers and token directories.
    location ~ ^/racp-logo\.(png|svg)$ {
        proxy_pass http://ancap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ^~ /_next/ {
        proxy_pass http://ancap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream frontend always;
        proxy_pass_header ETag;
    }

    location / {
        proxy_pass http://ancap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "private, max-age=0, must-revalidate" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream frontend always;
    }
}
