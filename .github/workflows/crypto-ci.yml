name: Crypto CI

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "ACP-crypto/**"
      - "contracts/bridge-bsc/**"
      - "contracts/robinhood-racp/**"
      - ".github/workflows/crypto-ci.yml"
  pull_request:
    paths:
      - "ACP-crypto/**"
      - "contracts/bridge-bsc/**"
      - "contracts/robinhood-racp/**"
      - ".github/workflows/crypto-ci.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: crypto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acp-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # RocksDB 8.10 relies on transitive integer headers removed by newer GCC.
      CXXFLAGS: "-include cstdint"
    defaults:
      run:
        working-directory: ACP-crypto
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Use production Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev libbz2-dev

      - name: Test default PQC feature set
        run: cargo test -p acp-crypto --locked

      - name: Test classical-only compatibility
        run: cargo test -p acp-crypto --no-default-features --locked

      - name: Test acp-node (RPC auth + unit suite)
        run: cargo test -p acp-node --locked

      - name: Test acp-mobile-ffi
        run: cargo test -p acp-mobile-ffi --locked

      - name: Check acp-wallet
        run: cargo check -p acp-wallet --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ACP-crypto
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Use audit toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  bridge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/bridge-bsc
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit

      - name: Forge test bridge contracts
        run: forge test -vv

  racp-operator-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/robinhood-racp
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install and audit operator dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Verify journal safety and compile without broadcasting
        run: |
          node --test test/safe-files.test.mjs
          node --check deploy.mjs
          node --check deploy-airdrop.mjs
          node --check issue.mjs
          node --input-type=module -e "import {compile} from './compile.mjs'; compile(); compile('src/RacpAirdrop.sol', 'RacpAirdrop');"
