name: Agent Bridge CI

on:
  push:
    branches: [master]
    paths: ['agent-bridge/**', '.github/workflows/agent-bridge-ci.yml']
  pull_request:
    paths: ['agent-bridge/**', '.github/workflows/agent-bridge-ci.yml']

permissions:
  contents: read

jobs:
  coordination:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - run: python -m unittest discover -s agent-bridge -p "test_*.py" -q
      - run: node agent-bridge/openclaw-scope/test.mjs
