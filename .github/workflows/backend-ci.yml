name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MASTER_ROADMAP.md"
      - "STATUS.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/bootstrap/**"
      - ".github/pull_request_template.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/secret-hygiene.yml"
      - ".githooks/**"
      - "scripts/bootstrap_ancap_docs_repo.py"
      - "scripts/check_secret_hygiene.py"
      - "scripts/check_alembic_single_head.py"
      - "scripts/check_pricing_sync.py"
      - "scripts/deploy-ancap-cloud.sh"
      - "scripts/ensure-acp1-host-proxy.sh"
      - "scripts/verify-genesis-keystores.py"
      - "ACP-crypto/genesis-addresses.json"
      - "ACP-crypto/genesis-keystore-manifest.json"
      - "scripts/export_ancap_docs.py"
      - "scripts/generate_ancap_docs_live_followup.py"
      - "scripts/generate_secret_hygiene_evidence.py"
      - "scripts/install_git_hooks.py"
      - "scripts/render_secret_rotation_evidence.py"
      - "requirements.in"
      - "requirements-dev.in"
      - "requirements-dev.txt"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MASTER_ROADMAP.md"
      - "STATUS.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/bootstrap/**"
      - ".github/pull_request_template.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/secret-hygiene.yml"
      - ".githooks/**"
      - "scripts/bootstrap_ancap_docs_repo.py"
      - "scripts/check_secret_hygiene.py"
      - "scripts/check_alembic_single_head.py"
      - "scripts/check_pricing_sync.py"
      - "scripts/deploy-ancap-cloud.sh"
      - "scripts/ensure-acp1-host-proxy.sh"
      - "scripts/verify-genesis-keystores.py"
      - "ACP-crypto/genesis-addresses.json"
      - "ACP-crypto/genesis-keystore-manifest.json"
      - "scripts/export_ancap_docs.py"
      - "scripts/generate_ancap_docs_live_followup.py"
      - "scripts/generate_secret_hygiene_evidence.py"
      - "scripts/install_git_hooks.py"
      - "scripts/render_secret_rotation_evidence.py"
      - "requirements.in"
      - "requirements-dev.in"
      - "requirements-dev.txt"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ancap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ancap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ancap
      GH_TOKEN: ${{ github.token }}
      # A failed migration must fail the job instead of wiping the schema.
      TEST_SCHEMA_FALLBACK: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Check single Alembic head
        run: python scripts/check_alembic_single_head.py

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Verify migration state
        run: |
          alembic current
          alembic heads

      - name: Alembic drift report (non-blocking baseline)
        # There is a large pre-existing metadata/migration drift backlog. Keep the
        # report visible without failing unrelated work until the drift is burned
        # down; the blocking guarantees are single-head + upgrade-on-empty-DB.
        continue-on-error: true
        run: alembic check

      - name: Run backend tests
        run: pytest -q --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

      - name: Dependency audit (non-blocking baseline)
        # First pass surfaces advisories without failing unrelated work; tighten
        # to blocking once the known-vulnerability baseline is cleared.
        continue-on-error: true
        run: python -m pip_audit --progress-spinner off

      - name: Verify frontend and backend catalogue parity
        run: python scripts/check_pricing_sync.py

      - name: Docs export / public-trust regression
        run: pytest tests/test_export_ancap_docs.py tests/test_public_trust_docs.py tests/test_status_summary.py tests/test_ancap_docs_split_ci_guard.py tests/test_bootstrap_ancap_docs_repo.py tests/test_generate_ancap_docs_live_followup.py -q
        env:
          RUN_ANCAP_DOCS_LIVE_VERIFY: "0"

      - name: Security SAST — Bandit
        run: |
          set -o pipefail
          python -m bandit -r app/ -ll -f txt 2>&1 | tee bandit-report.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          retention-days: 14

      - name: Docker build check
        run: |
          # Docker Hub occasional 502s should not fail an otherwise green backend job.
          for attempt in 1 2 3 4 5; do
            if docker build -t ancap:build-check .; then
              exit 0
            fi
            echo "docker build failed (attempt ${attempt}/5); retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "docker build failed after 5 attempts"
          exit 1

  test-unit:
    # Fast, database-free signal so PRs do not wait for the full PostgreSQL suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -q

