plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.acpcore'
version = '0.1.0'

android {
  namespace "expo.modules.acpcore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ["src/main/jniLibs"]
    }
  }
}

dependencies {
  implementation "net.java.dev.jna:jna:5.19.1@aar"
}
