services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for docker-compose.prod.yml and must match DATABASE_URL when using the bundled postgres service}
      POSTGRES_DB: ${POSTGRES_DB:-ancap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - ./Sicret/bridge-bsc/bridge.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for docker-compose.prod.yml, must not use insecure bundled-db default credentials, and must match POSTGRES_PASSWORD when using the bundled postgres service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for docker-compose.prod.yml and must match DATABASE_URL when using the bundled postgres service}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for docker-compose.prod.yml}       # required — no fallback; compose/app fail fast if missing
      CURSOR_SECRET: ${CURSOR_SECRET:?CURSOR_SECRET must be set for docker-compose.prod.yml} # required — no fallback; compose/app fail fast if missing
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set for docker-compose.prod.yml}       # required — no fallback; compose/app fail fast if missing
      # Browser origins for ancap.cloud ↔ api.ancap.cloud cookie credentials (SameSite=Lax).
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ancap.cloud,https://www.ancap.cloud}
      # L3 chain anchors (mock | acp | ethereum | solana)
      CHAIN_ANCHOR_DRIVER: acp
      # Local prod-like runtime should use the host ACP node directly.
      # Public acp1.ancap.cloud has been flaky/unresolved; keep containers pinned to the host runtime.
      ACP_RPC_URL: http://acp-node:8545/rpc
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      # ACP custodial hot-wallet helper (optional, required to enable /wallet/acp/*)
      ACP_WALLETD_PATH: ${ACP_WALLETD_PATH:-walletd}
      # Operator emails allowed to remain bound to custodial hot (comma-separated).
      # Override in host .env; fallback keeps the known operator account on hot after deploy.
      ACP_CUSTODIAL_HOT_HOLDER_EMAILS: ${ACP_CUSTODIAL_HOT_HOLDER_EMAILS:-dragon.cat.trx@gmail.com}
      # Custodial hot spend keystore (operator withdraw). Distinct from ACP_HOT_* bridge reserve.
      ACP_CUSTODIAL_HOT_KEYSTORE_FILE: ${ACP_CUSTODIAL_HOT_KEYSTORE_FILE:-/run/secrets/custodial-hot.keystore.json}
      # IMPORTANT: keep bridge runtime pinned to bridge-scoped signer material.
      # If this is sourced from project .env, Docker Compose can override the bridge secret
      # with a generic ACP hot-wallet path and reverse payouts will derive from the wrong wallet.
      ACP_HOT_MNEMONIC_FILE: /run/secrets/bridge-bsc/acp-reserve-mnemonic.txt
      ACP_WALLET_OPERATOR_SECRET: ${ACP_WALLET_OPERATOR_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://ancap.cloud}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      ACP_WALLET_RECOVERY_MASTER_KEY: ${ACP_WALLET_RECOVERY_MASTER_KEY:-}
      PLATFORM_ADMIN_USER_IDS: ${PLATFORM_ADMIN_USER_IDS:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-dragon.cat.trx@gmail.com}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      ALLOW_INSECURE_CRON: ${ALLOW_INSECURE_CRON:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ANCAP Support}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      LOGIN_ALERTS_ENABLED: ${LOGIN_ALERTS_ENABLED:-true}
      # Instantly.ai API v2 — Custom IMAP/SMTP account sync (key on host .env / GitHub secret)
      INSTANTLY_ENABLED: ${INSTANTLY_ENABLED:-false}
      INSTANTLY_API_KEY: ${INSTANTLY_API_KEY:-}
      INSTANTLY_API_BASE: ${INSTANTLY_API_BASE:-https://api.instantly.ai/api/v2}
      INSTANTLY_TIMEOUT_SECONDS: ${INSTANTLY_TIMEOUT_SECONDS:-30}
      # AETERNA longevity division (public /aeterna + vault APIs)
      FF_AETERNA: ${FF_AETERNA:-true}
      # Lunar land parcel desk (public /lunar + interests)
      FF_LUNAR_LAND: ${FF_LUNAR_LAND:-true}
      FF_WEB_USDT_TRC20_SWAP: ${FF_WEB_USDT_TRC20_SWAP:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-teneta_claude}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.tenetauniversity.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMART_PAY_VISION_PROVIDER: ${SMART_PAY_VISION_PROVIDER:-anthropic}
      SMART_PAY_WEVISONE_URL: ${SMART_PAY_WEVISONE_URL:-}
      SMART_PAY_WEVISONE_API_KEY: ${SMART_PAY_WEVISONE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Homepage dialog — free OpenRouter models only. Key stays on the host .env.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      HOME_CHAT_ENABLED: ${HOME_CHAT_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1800}
      LLM_DAILY_BUDGET_ACP: ${LLM_DAILY_BUDGET_ACP:-250}
      # Stripe / fiat adapter (optional; keep blank to leave ACP/manual flows only)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com/v1}
      # MoonPay Commerce / Helio (optional; keys on host .env only)
      HELIO_PUBLIC_KEY: ${HELIO_PUBLIC_KEY:-}
      HELIO_SECRET_KEY: ${HELIO_SECRET_KEY:-}
      HELIO_PAYLINK_ID: ${HELIO_PAYLINK_ID:-}
      HELIO_WEBHOOK_SHARED_TOKEN: ${HELIO_WEBHOOK_SHARED_TOKEN:-}
      HELIO_NETWORK: ${HELIO_NETWORK:-main}
      HELIO_PRIMARY_PAYMENT_METHOD: ${HELIO_PRIMARY_PAYMENT_METHOD:-fiat}
      HELIO_DEFAULT_AMOUNT: ${HELIO_DEFAULT_AMOUNT:-10}
      HELIO_CURRENCY_HINT: ${HELIO_CURRENCY_HINT:-USDC}
      # WebID KYC partner slot (optional; fail-closed — does not issue cards)
      WEBID_ENABLED: ${WEBID_ENABLED:-false}
      WEBID_API_BASE: ${WEBID_API_BASE:-}
      WEBID_CLIENT_ID: ${WEBID_CLIENT_ID:-}
      WEBID_CLIENT_SECRET: ${WEBID_CLIENT_SECRET:-}
      REFERRAL_ONCHAIN_PAYOUT_ENABLED: ${REFERRAL_ONCHAIN_PAYOUT_ENABLED:-false}
      REFERRAL_ONCHAIN_PAYOUT_KEYSTORE_FILE: ${REFERRAL_ONCHAIN_PAYOUT_KEYSTORE_FILE:-}
      REFERRAL_ONCHAIN_PAYOUT_FEE_ACP: ${REFERRAL_ONCHAIN_PAYOUT_FEE_ACP:-}
      # CoinGecko indicative market board (home ticker / reserves). Key stays on host .env only.
      COINGECKO_ENABLED: ${COINGECKO_ENABLED:-true}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-}
      COINGECKO_CACHE_TTL_SECONDS: ${COINGECKO_CACHE_TTL_SECONDS:-60}
      COINGECKO_WACP_COIN_ID: ${COINGECKO_WACP_COIN_ID:-}
      # Shared with acp-node for authenticated JSON-RPC (optional on api; empty disables client auth header).
      ACP_RPC_TOKEN: ${ACP_RPC_TOKEN:-}
      # AccuWeather Earth widget (https://www.accuweather.com/) — key on host .env only.
      ACCUWEATHER_ENABLED: ${ACCUWEATHER_ENABLED:-true}
      ACCUWEATHER_API_KEY: ${ACCUWEATHER_API_KEY:-}
      ACCUWEATHER_LANGUAGE: ${ACCUWEATHER_LANGUAGE:-en-us}
      # wACP / BSC clearing rail (see docs/bridge-spec-v1.md)
      # IMPORTANT: values come from ./Sicret/bridge-bsc/bridge.env via env_file.
      # Do not mirror them here with ${VAR:-default} fallbacks: compose-level
      # environment entries override env_file and can silently blank live bridge config.
    volumes:
      # Persist ACP hot-wallet mnemonic outside the container.
      # Directory is gitignored by project settings.
      - ./Sicret:/run/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
      args:
        # Prefer dedicated API host: public /api on ancap.cloud is stripped by an
        # upstream edge, so same-origin /api/v1 is unreliable for browser auth.
        NEXT_PUBLIC_API_URL: https://api.ancap.cloud/v1
        NEXT_PUBLIC_ACP_URL: /acp
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        APP_BUILD_ID: ${APP_BUILD_ID:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser auth/API calls go to api.ancap.cloud (CORS + cookie credentials).
      NEXT_PUBLIC_API_URL: https://api.ancap.cloud/v1
      # SSR fetches hit the API directly over the Docker network (no tunnel round-trip).
      ANCAP_SERVER_API_URL: http://api:8000/v1
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  acp-node:
    build:
      context: ./ACP-crypto
      dockerfile: acp-node/Dockerfile
    environment:
      ACP_DATA_DIR: /var/lib/acp-node
      ACP_RPC_LISTEN: 0.0.0.0:8545
      ACP_CHAIN_ID: 1001
      ACP_DISABLE_CREATOR_VESTING: "1"
      ACP_MINER_INTERVAL_SECS: "5"
      # Hard-cap consensus: validators are paid by signed spends from the
      # genesis reserve; the assembler must never mint heartbeat rewards.
      ACP_MINER_HEARTBEAT_ENABLED: "false"
      ACP_MINER_MAX_TXS_PER_BLOCK: "512"
      # Required in prod — acp-node fail-closes all non-public RPC methods without a token.
      ACP_RPC_TOKEN: ${ACP_RPC_TOKEN:?ACP_RPC_TOKEN must be set for acp-node}
    volumes:
      - ./Sicret/acp:/var/lib/acp-node
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
      acp-node:
        condition: service_started

volumes:
  pgdata:
  redisdata:

